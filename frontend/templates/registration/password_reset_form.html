{% extends "partials/main.html" %}

{% block content %}

<div class="container mt-5" style="max-width:500px">

<h3>Recuperar contraseña</h3>

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label>Email</label>
        {{ form.email }}
    </div>

    <button type="submit" class="btn btn-primary">
        Enviar enlace de recuperación
    </button>

</form>

</div>

{% endblock %}
